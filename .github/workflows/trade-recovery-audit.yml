name: One-time trade recovery audit

on:
  push:
    branches:
      - fix/trade-history-recovery

permissions:
  contents: write

jobs:
  aggregate-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test trade-history normalizer
        run: python3 scripts/test_fetch_trade_history.py
      - name: Fetch and aggregate executed team-to-team trades
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          mkdir -p artifacts audit
          for season in 2019 2020 2021 2022 2023 2024 2025; do
            python3 scripts/fetch_trade_history.py \
              --season "$season" \
              --output "artifacts/trade-history-$season.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          output = {
              'schema_version': 1,
              'source': 'ESPN kona_playercard audit',
              'seasons': {},
          }
          for season in range(2019, 2026):
              payload = json.loads(Path(f'artifacts/trade-history-{season}.json').read_text())
              candidates = [row for row in payload['transactions'] if row['has_team_to_team_move']]
              output['seasons'][str(season)] = {
                  'player_count': payload['player_count'],
                  'transaction_count': payload['transaction_count'],
                  'executed_trade_count': len(candidates),
                  'trades': candidates,
              }
          Path('audit/recovered-trades.json').write_text(json.dumps(output, indent=2) + '\n')
          for season, data in output['seasons'].items():
              print(f"{season}: {data['executed_trade_count']} executed trades")
          PY
      - name: Commit temporary recovery evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/recovered-trades.json
          git commit -m "Store temporary trade recovery evidence [skip ci]"
          git push origin HEAD:fix/trade-history-recovery
