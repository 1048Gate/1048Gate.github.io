name: One-time trade recovery audit

on:
  push:
    branches:
      - fix/trade-history-recovery

permissions:
  contents: read

jobs:
  audit-2025:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test trade-history normalizer
        run: python3 scripts/test_fetch_trade_history.py
      - name: Fetch 2025 ESPN player-card transactions
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          mkdir -p artifacts
          python3 scripts/fetch_trade_history.py \
            --season 2025 \
            --output artifacts/trade-history-2025.json
      - name: Summarize team-to-team candidates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('artifacts/trade-history-2025.json').read_text())
          candidates = [row for row in payload['transactions'] if row['has_team_to_team_move']]
          print(f"team_to_team_candidates={len(candidates)}")
          for row in candidates:
              print(json.dumps({
                  'espn_transaction_id': row['espn_transaction_id'],
                  'transaction_type': row['transaction_type'],
                  'status': row['status'],
                  'scoring_period': row['scoring_period'],
                  'transaction_date_ms': row['transaction_date_ms'],
                  'related_transaction_id': row['related_transaction_id'],
                  'items': [
                      {
                          'item_type': item['item_type'],
                          'player_id': item['player_id'],
                          'player_name': item['player_name'],
                          'from_team_id': item['from_team_id'],
                          'to_team_id': item['to_team_id'],
                      }
                      for item in row['items']
                  ],
              }, sort_keys=True))
          PY
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: trade-history-2025
          path: artifacts/trade-history-2025.json
          if-no-files-found: error
          retention-days: 14
