name: One-time trade recovery audit

on:
  push:
    branches:
      - fix/trade-history-recovery

permissions:
  contents: read

jobs:
  audit-history:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        season: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test trade-history normalizer
        run: python3 scripts/test_fetch_trade_history.py
      - name: Fetch ESPN player-card transactions
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          mkdir -p artifacts
          python3 scripts/fetch_trade_history.py \
            --season "${{ matrix.season }}" \
            --output "artifacts/trade-history-${{ matrix.season }}.json"
      - name: Summarize team-to-team candidates
        env:
          SEASON: ${{ matrix.season }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          season = os.environ['SEASON']
          payload = json.loads(Path(f'artifacts/trade-history-{season}.json').read_text())
          candidates = [row for row in payload['transactions'] if row['has_team_to_team_move']]
          print(json.dumps({
              'season': int(season),
              'player_count': payload['player_count'],
              'transaction_count': payload['transaction_count'],
              'team_to_team_candidates': len(candidates),
          }, sort_keys=True))
          for row in candidates:
              print('RECOVERED_TRADE ' + json.dumps({
                  'season': int(season),
                  'espn_transaction_id': row['espn_transaction_id'],
                  'transaction_type': row['transaction_type'],
                  'status': row['status'],
                  'scoring_period': row['scoring_period'],
                  'transaction_date_ms': row['transaction_date_ms'],
                  'related_transaction_id': row['related_transaction_id'],
                  'items': [
                      {
                          'item_type': item['item_type'],
                          'player_id': item['player_id'],
                          'player_name': item['player_name'],
                          'from_team_id': item['from_team_id'],
                          'to_team_id': item['to_team_id'],
                      }
                      for item in row['items']
                  ],
              }, sort_keys=True))
          PY
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: trade-history-${{ matrix.season }}
          path: artifacts/trade-history-${{ matrix.season }}.json
          if-no-files-found: error
          retention-days: 14
