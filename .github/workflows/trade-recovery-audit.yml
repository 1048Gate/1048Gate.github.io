name: One-time trade recovery packaging

on:
  push:
    branches:
      - fix/trade-history-recovery

permissions:
  contents: write

jobs:
  package-recovery:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build deterministic recovery data migration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('audit/recovered-trades.json').read_text())

          def q(value):
              if value is None:
                  return 'null'
              if isinstance(value, (int, float)):
                  return str(value)
              return "'" + str(value).replace("'", "''") + "'"

          sql = [
              '-- Generated from the audited ESPN kona_playercard recovery set.',
              '-- Contains verified EXECUTED trades only; roster-space DROP items are excluded.',
              'begin;',
              'delete from private.transaction_trade_recovery_items;',
              'delete from private.transaction_trade_recovery;',
          ]
          expected = {}
          for season in sorted(source['seasons'], key=int):
              data = source['seasons'][season]
              trades = data['trades']
              expected[int(season)] = len(trades)
              rows = []
              item_rows = []
              for trade in trades:
                  tx = trade['espn_transaction_id']
                  rows.append('(' + ','.join([
                      season,
                      q(tx),
                      q(trade.get('related_transaction_id')),
                      q(trade.get('scoring_period')),
                      q(trade.get('transaction_date_ms')),
                      q(trade.get('team_id')),
                  ]) + ')')
                  trade_items = [item for item in trade.get('items', []) if item.get('item_type') == 'TRADE']
                  for idx, item in enumerate(trade_items):
                      item_rows.append('(' + ','.join([
                          season,
                          q(tx),
                          str(idx),
                          q(item.get('item_type')),
                          q(item.get('player_id')),
                          q(item.get('player_name')),
                          q(item.get('from_team_id')),
                          q(item.get('to_team_id')),
                      ]) + ')')
              if rows:
                  sql.append('insert into private.transaction_trade_recovery (season_year,espn_transaction_id,related_transaction_id,scoring_period,transaction_date_ms,team_id) values\n' + ',\n'.join(rows) + ';')
              if item_rows:
                  sql.append('insert into private.transaction_trade_recovery_items (season_year,espn_transaction_id,item_index,item_type,player_id,player_name,from_team_id,to_team_id) values\n' + ',\n'.join(item_rows) + ';')

          sql.extend([
              "update private.transaction_trade_recovery set transaction_date = to_timestamp(transaction_date_ms::double precision / 1000.0) where transaction_date_ms is not null;",
              "do $validate$ declare v_total integer; begin select count(*) into v_total from private.transaction_trade_recovery; if v_total <> 85 then raise exception 'Expected 85 recovered trades, found %', v_total; end if; end $validate$;",
              'commit;',
              '',
          ])
          path = Path('supabase/migrations/20260831151000_016_trade_recovery_data.sql')
          path.write_text('\n'.join(sql))
          print('expected season counts:', expected)
          print('wrote', path)
          PY
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260831151000_016_trade_recovery_data.sql
          if git diff --cached --quiet; then
            echo "Migration already current"
            exit 0
          fi
          git commit -m "Add verified trade recovery data migration [skip ci]"
          git push origin HEAD:fix/trade-history-recovery
