name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN commits from data jobs do not emit a second push event.
  workflow_run:
    workflows:
      - Data health and current-season fetch
      - Import current-season transactions
      - Refresh championship futures
    types: [completed]
    branches: [main]

permissions:
  contents: read
  statuses: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Fetch the data commit created by the upstream workflow.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - name: Check whether this commit is already published
        id: deployment_guard
        uses: actions/github-script@v9
        with:
          script: |
            const currentSha = require('child_process')
              .execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' })
              .trim();

            core.setOutput('sha', currentSha);

            if (context.eventName !== 'workflow_run') {
              core.setOutput('should_deploy', 'true');
              return;
            }

            const { data } = await github.rest.repos.listCommitStatusesForRef({
              ...context.repo,
              ref: currentSha,
              per_page: 100,
            });

            const alreadyPublished = data.some(
              ({ context, state }) =>
                context === 'github-pages/fallback-deployment' && state === 'success',
            );
            const shouldDeploy = !alreadyPublished;
            core.info(
              shouldDeploy
                ? `No successful Pages publication is recorded for ${currentSha}.`
                : `GitHub Pages already published ${currentSha}; skipping a duplicate deployment.`,
            );
            core.setOutput('should_deploy', shouldDeploy ? 'true' : 'false');
      - name: Set up Node.js
        if: steps.deployment_guard.outputs.should_deploy == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate source
        if: steps.deployment_guard.outputs.should_deploy == 'true'
        run: npm run check
      - name: Build cache-safe site
        if: steps.deployment_guard.outputs.should_deploy == 'true'
        run: npm run build
      - name: Configure Pages
        if: steps.deployment_guard.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: steps.deployment_guard.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.deployment_guard.outputs.should_deploy == 'true'
        uses: actions/deploy-pages@v5
      - name: Mark commit as published to GitHub Pages
        if: steps.deployment_guard.outputs.should_deploy == 'true' && success()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: '${{ steps.deployment_guard.outputs.sha }}',
              state: 'success',
              context: 'github-pages/fallback-deployment',
              description: 'Published to the GitHub Pages fallback',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
