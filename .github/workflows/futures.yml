name: Refresh championship futures

on:
  schedule:
    # Tuesdays 06:00 UTC during the season; harmless off-season since the job
    # only commits when the recomputed odds actually change.
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Recompute odds from season data
        run: npm run futures
      - name: Validate site checks still pass
        run: npm run check
      - name: Commit updated odds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/site.json; then
            echo "Odds unchanged — nothing to commit."
          else
            git add data/site.json
            git commit -m "Refresh championship futures odds"
            git push
          fi
